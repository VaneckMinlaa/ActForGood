server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

jwt:
  secret: actforgood-secret-key-change-in-production-minimum-256-bits

logging:
  level:
    org.springframework.cloud.gateway: DEBUG
