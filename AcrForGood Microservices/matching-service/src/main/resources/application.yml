server:
  port: 8083

spring:
  application:
    name: matching-service
  datasource:
    url: jdbc:postgresql://localhost:5432/actforgood_matching
    username: postgres
    password: root
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

logging:
  level:
    com.actforgood: DEBUG
