<div class="auth-page">
  <div class="auth-card">
    <!-- Logo -->
    <div class="auth-logo">
      <span class="logo-actfor">ActFor</span><span class="logo-good">Good</span>
    </div>

    <h1 class="auth-title">Connexion</h1>
    <p class="auth-subtitle">Accédez à votre compte ActForGood</p>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="auth-form auth-form-login">
      <div class="form-field">
        <label class="form-label">Email <span class="required">*</span></label>
        <input
          type="email"
          class="form-input"
          formControlName="email"
          placeholder="votre.email@exemple.com">
        <span class="error" *ngIf="loginForm.get('email')?.invalid && loginForm.get('email')?.touched">
          Email invalide
        </span>
      </div>

      <div class="form-field">
        <label class="form-label">Mot de passe <span class="required">*</span></label>
        <input
          type="password"
          class="form-input"
          formControlName="password"
          placeholder="Votre mot de passe">
      </div>

      <button type="submit" class="btn-submit" [disabled]="!loginForm.valid">
        Se connecter
      </button>
    </form>

    <p class="auth-footer">
      Pas encore de compte ? <a routerLink="/auth/register" class="auth-link">Créer un compte</a>
    </p>
  </div>
</div>
