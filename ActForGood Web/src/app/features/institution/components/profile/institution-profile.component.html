<div class="profile-page">

  <div class="page-header">
    <div>
      <h1>Mon Espace</h1>
      <p>Gérez les informations publiques de votre institution</p>
    </div>
    <div class="saved-toast" *ngIf="saved">
      <mat-icon>check_circle</mat-icon> Modifications enregistrées
    </div>
  </div>

  <div class="profile-layout">

    <!-- Photo / Logo -->
    <div class="photo-panel">
      <div class="avatar-large">
        <mat-icon>account_circle</mat-icon>
      </div>
      <button class="btn-upload">
        <mat-icon>photo_camera</mat-icon>
        Changer la photo
      </button>
      <p class="upload-hint">JPG ou PNG, max 2 Mo</p>

      <div class="logo-section">
        <p class="logo-label">Logo de l'institution</p>
        <div class="logo-placeholder">
          <mat-icon>image</mat-icon>
        </div>
        <button class="btn-upload">
          <mat-icon>upload</mat-icon>
          Importer un logo
        </button>
      </div>
    </div>

    <!-- Form -->
    <div class="form-panel">
      <form (ngSubmit)="save()">

        <div class="form-group">
          <label>Nom de l'institution</label>
          <div class="input-wrap">
            <mat-icon>business</mat-icon>
            <input type="text" [(ngModel)]="profile.name" name="name" placeholder="Nom officiel" />
          </div>
        </div>

        <div class="form-group">
          <label>Secteur d'activité</label>
          <div class="input-wrap">
            <mat-icon>category</mat-icon>
            <select [(ngModel)]="profile.sector" name="sector">
              <option *ngFor="let s of sectors" [value]="s">{{ s }}</option>
            </select>
          </div>
        </div>

        <div class="form-group">
          <label>Ville</label>
          <div class="input-wrap">
            <mat-icon>location_on</mat-icon>
            <input type="text" [(ngModel)]="profile.city" name="city" placeholder="Ville" />
          </div>
        </div>

        <div class="form-group">
          <label>Description</label>
          <textarea [(ngModel)]="profile.description" name="description" rows="4"
            placeholder="Décrivez votre institution, sa mission et ses valeurs..."></textarea>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label>Email de contact</label>
            <div class="input-wrap">
              <mat-icon>email</mat-icon>
              <input type="email" [(ngModel)]="profile.email" name="email" />
            </div>
          </div>
          <div class="form-group">
            <label>Téléphone</label>
            <div class="input-wrap">
              <mat-icon>phone</mat-icon>
              <input type="text" [(ngModel)]="profile.phone" name="phone" />
            </div>
          </div>
        </div>

        <div class="form-group">
          <label>Site web</label>
          <div class="input-wrap">
            <mat-icon>language</mat-icon>
            <input type="text" [(ngModel)]="profile.website" name="website" placeholder="www.exemple.cm" />
          </div>
        </div>

        <div class="form-actions">
          <button type="submit" class="btn-save">
            <mat-icon>save</mat-icon>
            Enregistrer les modifications
          </button>
        </div>

      </form>
    </div>

  </div>

</div>
