<div class="admin-shell">

  <!-- MODERN SIDEBAR -->
  <aside class="sidebar">
    <div class="sidebar-brand">
      <div class="brand-info">
        <p class="brand-name">ActForGood</p>
        <p class="brand-role">Mission Admin</p>
      </div>
    </div>

    <nav class="sidebar-nav">
      <a *ngFor="let item of menuItems"
        [routerLink]="item.route"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: !!item.exact }"
        class="nav-item">
        <mat-icon class="nav-icon">{{ item.icon }}</mat-icon>
        <span class="nav-label">{{ item.label }}</span>
      </a>
    </nav>

    <div class="sidebar-bottom">
      <a routerLink="/admin/settings" class="nav-item">
        <mat-icon class="nav-icon">help_outline</mat-icon>
        <span class="nav-label">Profile</span>
      </a>
      <button class="nav-item" (click)="logout()">
        <mat-icon class="nav-icon">logout</mat-icon>
        <span class="nav-label">Déconnexion</span>
      </button>
    </div>
  </aside>

  <!-- MAIN WRAPPER -->
  <div class="main-wrapper">

    <!-- MODERN TOPBAR -->
    <header class="topbar">
      <div class="search-box">
        <mat-icon>search</mat-icon>
        <input type="text" placeholder="Rechercher dossiers, rapports, donateurs..." />
      </div>

      <div class="topbar-right">
        <button class="icon-btn notif-btn">
          <mat-icon>notifications_none</mat-icon>
          <span class="notif-dot"></span>
        </button>
        <button class="icon-btn">
          <mat-icon>settings</mat-icon>
        </button>

        <div class="admin-profile">
          <div class="profile-info">
            <p class="profile-name">Admin ActForGood</p>
            <p class="profile-role">Super Admin</p>
          </div>
          <div class="profile-avatar">
            <mat-icon>person</mat-icon>
          </div>
        </div>
      </div>
    </header>

    <!-- PAGE CONTENT -->
    <main class="page-content">
      <router-outlet></router-outlet>
    </main>

  </div>
</div>
