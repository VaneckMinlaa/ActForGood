<div class="dev-login-container">
  <div class="dev-login-card">
    <div class="header">
      <h1 class="logo">
        <span class="logo-actfor">ActFor</span><span class="logo-good">Good</span>
      </h1>
      <p class="subtitle">Mode Développement - Connexion Rapide</p>
      <div class="warning">
        <mat-icon>warning</mat-icon>
        <span>Ceci est un mode de développement uniquement</span>
      </div>
    </div>

    <div class="users-grid">
      <mat-card *ngFor="let user of devUsers" class="user-card" (click)="loginAs(user)">
        <div class="user-icon" [style.background-color]="getRoleColor(user.role)">
          <mat-icon>{{ getRoleIcon(user.role) }}</mat-icon>
        </div>
        <div class="user-info">
          <h3 class="user-name">{{ user.name }}</h3>
          <p class="user-email">{{ user.email }}</p>
          <p class="user-role">Rôle : {{ user.role }}</p>
        </div>
        <button mat-raised-button color="primary" class="login-btn">
          Se connecter
          <mat-icon>arrow_forward</mat-icon>
        </button>
      </mat-card>
    </div>

    <div class="footer">
      <p>Ou utilisez le <a routerLink="/auth/login">formulaire de connexion normal</a></p>
    </div>
  </div>
</div>
