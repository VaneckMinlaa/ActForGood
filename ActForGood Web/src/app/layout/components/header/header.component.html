<header class="header">
  <div class="header-container">
    <a routerLink="/" class="logo">ActForGood</a>
    <nav class="nav">
      <a routerLink="/mission" class="nav-link">Mission</a>
      <a routerLink="/campaigns" class="nav-link">Impact</a>
      <a routerLink="/get-involved" class="nav-link">Get Involved</a>
      <a routerLink="/stories" class="nav-link">Stories</a>
      <a routerLink="/campaigns" class="nav-link">Donate</a>
    </nav>
    <div class="header-actions">
      <button class="theme-toggle" (click)="themeService.toggleTheme()" [title]="(themeService.isDark$ | async) ? 'Passer au mode clair' : 'Passer au mode sombre'">
        <mat-icon>{{ (themeService.isDark$ | async) ? 'light_mode' : 'dark_mode' }}</mat-icon>
      </button>

      <button *ngIf="!isAuthenticated" routerLink="/auth/login" class="btn-glow-yellow">Connexion</button>
      <button *ngIf="isAuthenticated" (click)="logout()" class="btn-logout">Déconnexion</button>
    </div>
  </div>
</header>
